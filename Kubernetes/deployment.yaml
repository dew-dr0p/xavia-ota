apiVersion: apps/v1
kind: Deployment
metadata:
  name: xavia-ota
  namespace: xavia-ota
  labels:
    app: xavia-ota
spec:
  replicas: 3 # Start with 3, scale up to 5+ as needed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xavia-ota
  template:
    metadata:
      labels:
        app: xavia-ota
    spec:
      containers:
      - name: xavia-ota
        image: achebeh/xavia-ota
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: xavia-ota-config
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: POSTGRES_PORT
        - name: R2_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: R2_ACCOUNT_ID
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: R2_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: R2_SECRET_ACCESS_KEY
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: R2_BUCKET_NAME
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: ADMIN_PASSWORD
        - name: UPLOAD_KEY
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: UPLOAD_KEY
        - name: PRIVATE_KEY_BASE_64
          valueFrom:
            secretKeyRef:
              name: xavia-ota-secrets
              key: PRIVATE_KEY_BASE_64
        - name: S3_ENDPOINT
          value: "https://$(R2_ACCOUNT_ID).r2.cloudflarestorage.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "1000m"
          limits:
            memory: "1Gi"
            cpu: "1500m"    
      