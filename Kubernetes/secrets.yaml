apiVersion: v1
kind: Secret
metadata:
  name: xavia-ota-secrets
  namespace: xavia-ota
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "xavia_user"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "xavia_ota_db"
  POSTGRES_HOST: "changeme"
  POSTGRES_PORT: "5432"

  # R2 Storage credentials
  R2_ACCOUNT_ID: "changeme"
  R2_ACCESS_KEY_ID: "changeme"
  R2_SECRET_ACCESS_KEY: "changeme"
  R2_BUCKET_NAME: "changeme"
  # Admin credentials
  ADMIN_PASSWORD: "changeme"

  # Upload key (for publishing updates)
  UPLOAD_KEY: "changeme"

  # Code signing (base64 encoded private key)
  PRIVATE_KEY_BASE_64: "changeme"